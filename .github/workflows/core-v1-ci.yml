name: Core v1 CI

on:
  push:
    branches:
      - feat/core-v1-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agnes_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agnes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agnes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/persistence/migrations/001_core.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/persistence/migrations/002_education.sql

      - name: Run focused health-route test
        run: npm test -- tests/unit/health-routes.test.ts

      - name: Run quality gates
        run: npm run check

      - name: Check formatting
        run: npm run format:check
