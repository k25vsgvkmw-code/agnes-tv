name: AGNES Family Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/agnes-family-tablet-v1
    paths:
      - 'android/agnes-family/**'
      - '.github/workflows/agnes-family-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle -p android/agnes-family testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android/agnes-family assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agnes-family-debug-apk
          path: android/agnes-family/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
