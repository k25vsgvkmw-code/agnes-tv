name: Format diagnose

on:
  push:
    branches:
      - feat/core-v1-foundation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show notification formatting delta
        run: |
          npx prettier src/notifications/notification.ts --write
          git diff -- src/notifications/notification.ts
          git diff --exit-code -- src/notifications/notification.ts
