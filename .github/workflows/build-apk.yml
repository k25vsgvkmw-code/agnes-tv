name: Build AGNES TV APK

on:
  push:
    branches: [ main, v2-foundation-live ]
    paths-ignore:
      - 'releases/**'
      - 'build-report.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agnes-tv-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Xtream endpoint without credentials
        shell: bash
        run: python3 scripts/probe_xtream_endpoint.py | tee endpoint-probe.log

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Export Android signing tools
        shell: bash
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BT/apksigner"
          test -x "$BT/zipalign"
          mkdir -p /tmp/android-signing-tools
          cp "$BT/apksigner" /tmp/android-signing-tools/
          cp "$BT/zipalign" /tmp/android-signing-tools/
          cp -R "$BT/lib" /tmp/android-signing-tools/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: AGNES-TV-signing-tools
          path: /tmp/android-signing-tools/
          if-no-files-found: error

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AGNES-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload endpoint probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AGNES-TV-endpoint-probe
          path: endpoint-probe.log
          if-no-files-found: warn

      - name: Publish result in repository
        if: always()
        shell: bash
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          tail -n 220 build-output.log > /tmp/build-report.txt || true
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/AGNES-TV.apk
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"

          cp /tmp/build-report.txt build-report.txt
          git add build-report.txt

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            mkdir -p releases
            cp /tmp/AGNES-TV.apk "releases/AGNES-TV-v${VERSION_NAME}.apk"
            git add "releases/AGNES-TV-v${VERSION_NAME}.apk"
          fi

          if ! git diff --cached --quiet; then
            git commit -m "AGNES TV build result v${VERSION_NAME}"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          if [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
