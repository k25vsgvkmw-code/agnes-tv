name: AGNES Core TDD

on:
  push:
    branches:
      - feature/agnes-core-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agnes_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agnes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d agnes_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Bootstrap package lock on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Core v1 dependencies"
            git push origin HEAD:feature/agnes-core-v1
          fi
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run format:check
