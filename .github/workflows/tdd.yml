name: AGNES Core TDD

on:
  push:
    branches:
      - feature/agnes-core-v1
      - feature/agnes-live-core-v2
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agnes_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agnes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d agnes_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: |
          npx prettier --write src/notifications/channel-router.ts src/notifications/routed-notification-delivery.ts tests/unit/channel-router.test.ts
          git diff -- src/notifications/channel-router.ts src/notifications/routed-notification-delivery.ts tests/unit/channel-router.test.ts
          exit 1
