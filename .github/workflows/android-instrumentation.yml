name: Android TV Instrumentation Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agnes-tv-instrumentation-main
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        id: tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AGNES-TV-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

      - name: Publish instrumentation result
        if: always()
        shell: bash
        run: |
          {
            echo "Android TV instrumentation UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $GITHUB_SHA"
            echo "result: ${{ steps.tests.outcome }}"
            echo "tests: password-only login; Xtream auth gate; matches; channels; player; movies; kids"
          } > /tmp/instrumentation-report.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp /tmp/instrumentation-report.txt instrumentation-report.txt
          git add instrumentation-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Android TV instrumentation result"
            git push origin HEAD:main
          fi

      - name: Fail if instrumentation failed
        if: steps.tests.outcome != 'success'
        run: exit 1
