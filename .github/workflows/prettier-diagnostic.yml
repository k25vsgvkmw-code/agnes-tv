name: Prettier Diagnostic

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact formatted mission file
        run: npx prettier src/kidsworld/mission.ts
