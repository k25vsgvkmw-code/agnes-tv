name: Import Zagori Assets

on:
  push:
    branches: [feature/greece-roadtrip-zagori-spec]
    paths:
      - 'docs/travel/assets/zagori/import-trigger.txt'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/greece-roadtrip-zagori-spec
      - name: Download curated Wikimedia Commons photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/travel/assets/zagori
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/%CE%A0%CE%B1%CF%80%CE%B9%CE%B3%CE%BA%CE%BF_%CE%96%CE%B1%CE%B3%CF%8C%CF%81%CE%B9.jpg/1280px-%CE%A0%CE%B1%CF%80%CE%B9%CE%B3%CE%BA%CE%BF_%CE%96%CE%B1%CE%B3%CF%8C%CF%81%CE%B9.jpg' -o docs/travel/assets/zagori/papingo-autumn.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/VikosGorge.jpg/1280px-VikosGorge.jpg' -o docs/travel/assets/zagori/vikos-gorge.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Metsovo_Greece.jpg/1280px-Metsovo_Greece.jpg' -o docs/travel/assets/zagori/metsovo-autumn.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Meteora_in_the_early_morning_hours.jpg/1280px-Meteora_in_the_early_morning_hours.jpg' -o docs/travel/assets/zagori/meteora-morning.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/4/42/Meteora_Sunset.jpg' -o docs/travel/assets/zagori/meteora-sunset.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/LAKE_OF_IOANNINA.jpg/1024px-LAKE_OF_IOANNINA.jpg' -o docs/travel/assets/zagori/ioannina-autumn.jpg
          test "$(find docs/travel/assets/zagori -name '*.jpg' -size +20k | wc -l)" -eq 6
      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/travel/assets/zagori/*.jpg
          git commit -m 'assets(travel): add credited Zagori photography'
          git push origin HEAD:feature/greece-roadtrip-zagori-spec
