name: Update Cinematic Tests Once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align emulator tests with cinematic UI contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flow = Path('app/src/androidTest/java/mom/agnes/tv/AgnesTvFlowTest.kt')
          s = flow.read_text(encoding='utf-8')

          old = '''            compose.waitUntil(10_000) {
                          compose.onAllNodes(hasText("Test Movie Greek Subs")).fetchSemanticsNodes().isNotEmpty()
                      }
                      compose.onNodeWithText("Test Movie Greek Subs").performClick()'''
          new = '''            compose.waitUntil(10_000) {
                          compose.onAllNodes(hasText("AGNES CINEMA")).fetchSemanticsNodes().isNotEmpty()
                      }
                      compose.onNodeWithText("▶ ΔΕΣ ΤΩΡΑ").performClick()'''
          if old not in s:
              raise SystemExit('Movie flow expectation not found')
          s = s.replace(old, new, 1)

          old = '''            compose.waitUntil(10_000) {
                          compose.onAllNodes(hasText("Kids Test Cartoon")).fetchSemanticsNodes().isNotEmpty()
                      }
                      assertTrue(compose.onAllNodes(hasText("Kids Test Cartoon")).fetchSemanticsNodes().isNotEmpty())'''
          new = '''            compose.waitUntil(10_000) {
                          compose.onAllNodes(hasText("AGNES KIDS")).fetchSemanticsNodes().isNotEmpty()
                      }
                      assertTrue(compose.onAllNodes(hasText("AGNES KIDS")).fetchSemanticsNodes().isNotEmpty())'''
          if old not in s:
              raise SystemExit('Kids flow expectation not found')
          s = s.replace(old, new, 1)

          marker = '''            assertEquals("secret", prefs.getString("password", null))
                  }
              }
          
              @Test
              fun loginIsPasswordOnlyAndVerifiesBeforeOpening()'''
          replacement = '''            assertEquals("secret", prefs.getString("password", null))
                      device.pressBack()
                      compose.waitForIdle()
                  }
              }
          
              @Test
              fun loginIsPasswordOnlyAndVerifiesBeforeOpening()'''
          if marker not in s:
              raise SystemExit('Auto-login isolation marker not found')
          s = s.replace(marker, replacement, 1)

          marker = '''            assertTrue(compose.onAllNodes(hasText("ΟΛΟΙ ΟΙ ΑΓΩΝΕΣ ΣΗΜΕΡΑ")).fetchSemanticsNodes().isNotEmpty())
                  }
              }
          
              @Test
              fun staleSavedConfigMustNotBypassPasswordLogin()'''
          replacement = '''            assertTrue(compose.onAllNodes(hasText("ΟΛΟΙ ΟΙ ΑΓΩΝΕΣ ΣΗΜΕΡΑ")).fetchSemanticsNodes().isNotEmpty())
                      device.pressBack()
                      compose.waitForIdle()
                  }
              }
          
              @Test
              fun staleSavedConfigMustNotBypassPasswordLogin()'''
          if marker not in s:
              raise SystemExit('Password-login isolation marker not found')
          s = s.replace(marker, replacement, 1)
          flow.write_text(s, encoding='utf-8')

          cinematic = Path('app/src/androidTest/java/mom/agnes/tv/CinematicUiRegressionTest.kt')
          s = cinematic.read_text(encoding='utf-8')
          s = s.replace('compose.onAllNodes(hasText("Cinema Test Movie")).fetchSemanticsNodes().isNotEmpty()', 'compose.onAllNodes(hasText("AGNES CINEMA")).fetchSemanticsNodes().isNotEmpty()', 1)
          s = s.replace('compose.onAllNodes(hasText("Kids Cinema Test")).fetchSemanticsNodes().isNotEmpty()', 'compose.onAllNodes(hasText("AGNES KIDS")).fetchSemanticsNodes().isNotEmpty()', 1)
          cinematic.write_text(s, encoding='utf-8')

          memory = Path('app/src/androidTest/java/mom/agnes/tv/VodMemoryRegressionTest.kt')
          s = memory.read_text(encoding='utf-8')
          s = s.replace('compose.onAllNodes(hasText("Test Movie Greek Subs")).fetchSemanticsNodes().isNotEmpty()', 'compose.onAllNodes(hasText("AGNES CINEMA")).fetchSemanticsNodes().isNotEmpty()', 1)
          s = s.replace('compose.onAllNodes(hasText("Kids Test Cartoon")).fetchSemanticsNodes().isNotEmpty()', 'compose.onAllNodes(hasText("AGNES KIDS")).fetchSemanticsNodes().isNotEmpty()', 1)
          memory.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-cinematic-tests-once.yml
          git add app/src/androidTest/java/mom/agnes/tv/AgnesTvFlowTest.kt \
                  app/src/androidTest/java/mom/agnes/tv/CinematicUiRegressionTest.kt \
                  app/src/androidTest/java/mom/agnes/tv/VodMemoryRegressionTest.kt \
                  .github/workflows/update-cinematic-tests-once.yml
          git commit -m "Align tests with cinematic VOD contract"
          git push origin HEAD:main
