name: Fix Cinematic Syntax Once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix broken Kotlin newline literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/mom/agnes/tv/MainActivity.kt')
          s = path.read_text(encoding='utf-8')
          broken = '''else "Δεν βρέθηκαν VOD κατηγορίες που να δηλώνουν Greek/GR subtitles.
          Δεν θα εμφανιστεί επιβεβαιωμένο 🇬🇷 αν δεν βρεθεί πραγματικό Greek subtitle track."'''
          fixed = 'else "Δεν βρέθηκαν VOD κατηγορίες που να δηλώνουν Greek/GR subtitles.\\nΔεν θα εμφανιστεί επιβεβαιωμένο 🇬🇷 αν δεν βρεθεί πραγματικό Greek subtitle track."'
          if broken not in s:
              raise SystemExit('Expected broken cinematic string not found')
          s = s.replace(broken, fixed, 1)
          path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-cinematic-syntax-once.yml
          git add app/src/main/java/mom/agnes/tv/MainActivity.kt .github/workflows/fix-cinematic-syntax-once.yml
          git commit -m "Fix cinematic Kotlin newline literal"
          git push origin HEAD:main
